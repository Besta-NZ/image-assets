name: Update Image Catalog

on:
  push:
    branches:
      - main
    paths:
      - "images/**"
      - "thumbs/**"
      - "scripts/generate_catalog.py"

permissions:
  contents: write

jobs:
  update-catalog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install Pillow

      - name: Generate catalog.json (auto-create thumbs if missing)
        run: python scripts/generate_catalog.py

      - name: Commit & push changes (if any)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog.json thumbs/
          if git diff --quiet --cached catalog.json thumbs/; then
            echo "catalog.json 和 thumbs/ 都没有变化，跳过提交。"
          else
            git commit -m "chore: regenerate catalog.json & thumbs [skip ci]"
            git push
          fi
